<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Cette ligne est CRUCIALE pour le rendu mobile-first -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Gacha Pack Opener & Inventaire 3D</title>
    <link rel="stylesheet" href="style/style.css">
    
    <script src="js/series.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>

    <div id="overlay"></div>

    <div id="zoom-portal">
        <div class="portal-card-wrapper" id="portal-wrapper"></div>
    </div>

    <h1>Gacha Pack Opener</h1>

    <!-- ÉCRAN 1 : FORMULAIRE DE COMPTE -->
    <div id="auth-screen" class="screen active">
        <div class="form-container">
            <h2>Créer un compte</h2>
            <p>Choisis un pseudo pour sauvegarder ton inventaire.</p>
            <div class="form-group">
                <input type="text" id="username-input" placeholder="Ton pseudo..." maxlength="15">
                <button id="login-btn">Jouer</button>
            </div>
        </div>
    </div>

    <!-- ÉCRAN 2 : ZONE DE JEU -->
    <div id="game-screen" class="screen">
        <div class="profile-bar">
            <span class="player-name">Joueur : <strong id="display-username"></strong></span>
            
            <div class="series-box">
                <label for="series-select">Série :</label>
                <select id="series-select"></select>
            </div>

            <button id="logout-btn" class="logout-btn">Quitter</button>
        </div>

        <button id="draw-btn" class="main-draw-btn">Ouvrir un pack</button>
        
        <div id="pack-container"></div>

        <!-- Section de l'inventaire persistant -->
        <div class="inventory-section">
            <h3>Mon Inventaire</h3>
            <div id="inventory-grid" class="inventory-grid"></div>
        </div>
    </div>

</body>
</html>
